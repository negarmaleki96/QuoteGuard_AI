services:
  - type: web
    name: quoteguard-backend
    env: node
    rootDir: server
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: http://localhost:5173
